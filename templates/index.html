<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baby Weight Prediction AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 1000px;
        background: white;
        border-radius: 28px;
        overflow: hidden;
        display: grid;
        grid-template-columns: 1fr 1fr;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      }

      .left-panel {
        background:
          linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
          url("https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?q=80&w=1200&auto=format&fit=crop");
        background-size: cover;
        background-position: center;
        color: white;
        padding: 60px 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .left-panel h1 {
        font-size: 42px;
        line-height: 1.2;
        margin-bottom: 20px;
      }

      .left-panel p {
        font-size: 16px;
        line-height: 1.8;
        opacity: 0.95;
      }

      .right-panel {
        padding: 50px 40px;
      }

      .title {
        font-size: 32px;
        color: #333;
        margin-bottom: 8px;
        font-weight: 700;
      }

      .subtitle {
        color: #777;
        margin-bottom: 35px;
        font-size: 15px;
      }

      form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
      }

      .input-box {
        display: flex;
        flex-direction: column;
      }

      .input-box.full {
        grid-column: 1/3;
      }

      label {
        margin-bottom: 8px;
        font-size: 14px;
        color: #444;
        font-weight: 500;
      }

      input,
      select {
        padding: 15px;
        border-radius: 14px;
        border: 2px solid #e5e5e5;
        outline: none;
        transition: 0.3s;
        font-size: 15px;
        background: #fafafa;
      }

      input:focus,
      select:focus {
        border-color: #667eea;
        background: white;
        box-shadow: 0 0 10px rgba(102, 126, 234, 0.2);
      }

      .predict-btn {
        grid-column: 1/3;
        padding: 16px;
        border: none;
        border-radius: 16px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
      }

      .predict-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .result-box h2 {
        color: #333;
        margin-bottom: 8px;
        font-size: 22px;
      }

      .result-box p {
        color: #555;
        font-size: 17px;
        line-height: 1.7;
      }

      @media (max-width: 900px) {
        .container {
          grid-template-columns: 1fr;
        }

        .left-panel {
          min-height: 300px;
        }
      }

      @media (max-width: 600px) {
        .right-panel {
          padding: 35px 22px;
        }

        form {
          grid-template-columns: 1fr;
        }

        .input-box.full,
        .predict-btn {
          grid-column: auto;
        }

        .left-panel h1 {
          font-size: 32px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="left-panel">
        <h1>AI Baby Weight Prediction</h1>
        <p>
          Predict expected baby birth weight using maternal health and pregnancy
          details. This intelligent prediction system uses machine learning to
          estimate newborn weight accurately.
        </p>
      </div>

      <div class="right-panel">
        <h2 class="title">Prediction Form</h2>
        <p class="subtitle">Fill in all medical details carefully.</p>

        <form id="predictForm" method="POST" action="/pred">
          <div class="input-box">
            <label>Gestation Period (days)</label>
            <input type="number" step="any" id="gestation" required />
          </div>

          <div class="input-box">
            <label>Parity</label>
            <input type="number" step="any" id="parity" required />
          </div>

          <div class="input-box">
            <label>Mother Age</label>
            <input type="number" step="any" id="age" required />
          </div>

          <div class="input-box">
            <label>Height (inches)</label>
            <input type="number" step="any" id="height" required />
          </div>

          <div class="input-box">
            <label>Mother Weight (ounces)</label>
            <input type="number" step="any" id="weight" required />
          </div>

          <div class="input-box">
            <label>Smoking Status</label>
            <select id="smoke" required>
              <option value="">Select</option>
              <option value="1">Smoker</option>
              <option value="0">Non-Smoker</option>
            </select>
          </div>

          <button type="submit" class="predict-btn">Predict Baby Weight</button>
        </form>

        <div class="result-box" id="resultBox">
          <h2>Prediction Result</h2>
          <p id="resultText"></p>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById("predictForm");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const data = {
          gestation: parseFloat(document.getElementById("gestation").value),
          parity: parseFloat(document.getElementById("parity").value),
          age: parseFloat(document.getElementById("age").value),
          height: parseFloat(document.getElementById("height").value),
          weight: parseFloat(document.getElementById("weight").value),
          smoke: parseFloat(document.getElementById("smoke").value),
        };

        try {
  const response = await fetch("/pred", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
    },
    body: JSON.stringify(data),
  });

  const result = await response.json();

  if (!response.ok) {
    throw new Error(result.error || "Server Error");
  }

  document.getElementById("resultBox").style.display = "block";

  document.getElementById("resultText").innerHTML = `

<div style="
display:flex;
align-items:center;
gap:20px;
">

<div style="
width:80px;
height:80px;
border-radius:50%;
background:linear-gradient(135deg,#667eea,#764ba2);
display:flex;
justify-content:center;
align-items:center;
font-size:38px;
color:white;
box-shadow:0 10px 25px rgba(102,126,234,0.3);
">
👶
</div>

<div>
<h3 style="
font-size:26px;
color:#333;
margin-bottom:6px;
">
Prediction Completed
</h3>

<p style="
color:#666;
font-size:15px;
margin-bottom:10px;
">
Estimated Baby Weight
</p>

<h1 style="
font-size:42px;
color:#667eea;
font-weight:700;
">
${result.response} ounces
</h1>

</div>

</div>
`;

} catch (error) {

  console.log(error);

  document.getElementById("resultBox").style.display = "block";

  document.getElementById("resultText").innerHTML = `
    <h2 style="color:red;">API Error</h2>
    <p>${error.message}</p>
  `;
}
